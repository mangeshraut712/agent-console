name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            agent-server/package-lock.json

      - name: Install dependencies
        run: npm run setup

      - name: Lint
        run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  protocol:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            agent-server/package-lock.json

      - name: Install dependencies
        run: npm run setup

      - name: Protocol verification
        run: |
          set -euo pipefail
          npm start --prefix agent-server > /tmp/agent-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4747/health >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "agent-server exited before it became healthy"
              cat /tmp/agent-server.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "agent-server did not become healthy in time"
            cat /tmp/agent-server.log
            exit 1
          fi
          npm run verify:server
          node agent-server/test.mjs
